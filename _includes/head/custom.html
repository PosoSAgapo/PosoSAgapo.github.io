<!-- Theme preference. Runs before first paint so an explicit dark choice
     never flashes a white page. No stored value = follow the OS. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      if (stored === 'dark' || stored === 'light') {
        document.documentElement.setAttribute('data-theme', stored);
      }
    } catch (e) { /* private mode: fall back to the OS preference */ }

    function systemPrefersDark() {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    function setup() {
      var button = document.getElementById('theme-toggle');
      if (!button) { return; }
      button.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme');
        if (!current) { current = systemPrefersDark() ? 'dark' : 'light'; }
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', setup);
    } else {
      setup();
    }
  })();
</script>
